<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎬 CINEVERSE | جهان سینما و تئاتر</title>
<meta name="description" content="CINEVERSE - سفری نهایی به دنیای سینما و تئاتر">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;900&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root{
    --bg:#05050a;
    --bg2:#0d0d16;
    --gold:#e6b800;
    --gold2:#ffd700;
    --gold3:#fff4b8;
    --red:#e63946;
    --purple:#8b5cf6;
    --cyan:#06b6d4;
    --text:#f0f0f0;
    --muted:#8a8a9a;
    --card:rgba(255,255,255,0.03);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Vazirmatn',sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.9;
    overflow-x:hidden;
    cursor:none;
  }

  /* CUSTOM CURSOR */
  .cursor{
    position:fixed;width:12px;height:12px;border-radius:50%;
    background:var(--gold);pointer-events:none;z-index:99999;
    transform:translate(-50%,-50%);transition:transform .1s, width .3s, height .3s;
    mix-blend-mode:difference;
  }
  .cursor-ring{
    position:fixed;width:40px;height:40px;border:2px solid var(--gold);
    border-radius:50%;pointer-events:none;z-index:99998;
    transform:translate(-50%,-50%);transition:.15s ease-out;
    opacity:.6;
  }
  @media(max-width:768px){body{cursor:auto;} .cursor,.cursor-ring{display:none;}}

  /* FILM GRAIN OVERLAY */
  body::after{
    content:"";position:fixed;inset:0;z-index:9999;pointer-events:none;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/%3E%3C/svg%3E");
    opacity:0.035;
  }

  /* BACKGROUND */
  #bg{
    position:fixed;top:0;left:0;width:100%;height:100%;z-index:-2;
    background:radial-gradient(circle at 20% 30%, rgba(230,184,0,0.06), transparent 40%),
               radial-gradient(circle at 80% 70%, rgba(139,92,246,0.06), transparent 40%),
               radial-gradient(circle at 50% 50%, rgba(230,57,70,0.04), transparent 50%),
               var(--bg);
  }
  .orb{
    position:fixed;border-radius:50%;filter:blur(80px);z-index:-1;
    animation:float 20s infinite ease-in-out;
  }
  .orb1{width:400px;height:400px;background:rgba(230,184,0,0.15);top:10%;left:5%;}
  .orb2{width:350px;height:350px;background:rgba(139,92,246,0.15);bottom:10%;right:5%;animation-delay:-7s;}
  .orb3{width:300px;height:300px;background:rgba(230,57,70,0.12);top:50%;left:50%;animation-delay:-14s;}
  @keyframes float{
    0%,100%{transform:translate(0,0) scale(1);}
    33%{transform:translate(80px,-60px) scale(1.15);}
    66%{transform:translate(-60px,80px) scale(0.9);}
  }

  /* SCROLL PROGRESS */
  .progress-bar{
    position:fixed;top:0;left:0;height:3px;z-index:10000;
    background:linear-gradient(90deg,var(--gold),var(--red),var(--purple));
    width:0%;transition:width .1s;box-shadow:0 0 15px var(--gold);
  }

  /* NAV */
  nav{
    position:fixed;top:0;left:0;right:0;z-index:1000;
    padding:18px 5%;
    background:rgba(5,5,10,0.6);
    backdrop-filter:blur(20px) saturate(180%);
    border-bottom:1px solid rgba(230,184,0,0.1);
    transition:.4s;
  }
  nav.scrolled{padding:12px 5%;background:rgba(5,5,10,0.95);box-shadow:0 10px 40px rgba(0,0,0,0.5);}
  .nav-wrap{display:flex;justify-content:space-between;align-items:center;max-width:1500px;margin:auto;}
  .logo{
    font-size:1.6rem;font-weight:900;font-family:'Cinzel',serif;
    background:linear-gradient(135deg,var(--gold3),var(--gold),var(--red));
    background-size:200% 200%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    display:flex;align-items:center;gap:12px;
    animation:shine 4s ease infinite;
    letter-spacing:2px;
  }
  @keyframes shine{
    0%,100%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
  }
  .logo i{color:var(--gold);font-size:1.8rem;filter:drop-shadow(0 0 10px var(--gold));animation:spin3d 6s infinite linear;}
  @keyframes spin3d{
    0%{transform:rotateY(0);}
    100%{transform:rotateY(360deg);}
  }
  .nav-links{display:flex;gap:32px;list-style:none;}
  .nav-links a{
    color:var(--text);text-decoration:none;font-weight:500;
    position:relative;transition:.3s;font-size:.95rem;
    padding:5px 0;
  }
  .nav-links a::before{
    content:attr(data-text);position:absolute;top:5px;right:0;
    color:var(--gold);clip-path:inset(0 100% 0 0);transition:.4s;
  }
  .nav-links a:hover::before{clip-path:inset(0 0 0 0);}
  .nav-links a::after{
    content:"";position:absolute;bottom:0;right:0;width:0;height:2px;
    background:linear-gradient(90deg,var(--gold),var(--red));
    transition:.4s;box-shadow:0 0 10px var(--gold);
  }
  .nav-links a:hover::after{width:100%;}
  .menu-btn{display:none;background:none;border:none;color:var(--gold);font-size:1.5rem;cursor:pointer;}

  /* HERO */
  .hero{
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    text-align:center;padding:120px 5% 80px;position:relative;
    overflow:hidden;
  }
  .hero-content{max-width:1000px;z-index:2;animation:fadeUp 1.5s ease;}
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(60px);}
    to{opacity:1;transform:translateY(0);}
  }
  .hero-badge{
    display:inline-flex;align-items:center;gap:10px;
    padding:10px 24px;border-radius:50px;
    background:rgba(230,184,0,0.08);
    border:1px solid rgba(230,184,0,0.3);
    color:var(--gold);font-size:.9rem;margin-bottom:30px;
    position:relative;overflow:hidden;
    backdrop-filter:blur(10px);
  }
  .hero-badge::before{
    content:"";position:absolute;top:0;left:-100%;width:100%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(230,184,0,0.3),transparent);
    animation:sweep 3s infinite;
  }
  @keyframes sweep{to{left:100%;}}
  .hero h1{
    font-size:clamp(2.5rem,8vw,6rem);font-weight:900;line-height:1.1;
    margin-bottom:15px;
    background:linear-gradient(135deg,#fff 10%,var(--gold) 40%,var(--red) 70%,var(--purple) 100%);
    background-size:200% auto;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:gradientMove 6s ease infinite;
    font-family:'Cinzel',serif;
    letter-spacing:3px;
    filter:drop-shadow(0 0 40px rgba(230,184,0,0.3));
  }
  @keyframes gradientMove{
    0%,100%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
  }
  .hero-sub{
    font-size:clamp(1.4rem,3vw,2rem);font-weight:700;margin-bottom:25px;
    color:var(--gold2);font-family:'Cinzel',serif;letter-spacing:6px;
    text-shadow:0 0 20px rgba(230,184,0,0.5);
  }
  .hero p{
    font-size:clamp(1rem,2vw,1.2rem);color:var(--muted);
    margin-bottom:45px;max-width:750px;margin-inline:auto;
  }
  .hero-btns{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;}
  .btn{
    padding:16px 38px;border-radius:50px;text-decoration:none;font-weight:700;
    transition:.4s;display:inline-flex;align-items:center;gap:10px;cursor:pointer;
    border:none;font-family:inherit;position:relative;overflow:hidden;
    font-size:1rem;
  }
  .btn-primary{
    background:linear-gradient(135deg,var(--gold),var(--red));
    color:#000;box-shadow:0 10px 40px rgba(230,184,0,0.5);
  }
  .btn-primary::before{
    content:"";position:absolute;top:0;left:-100%;width:100%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,0.4),transparent);
    transition:.6s;
  }
  .btn-primary:hover::before{left:100%;}
  .btn-primary:hover{transform:translateY(-4px) scale(1.03);box-shadow:0 20px 50px rgba(230,184,0,0.7);}
  .btn-outline{
    background:rgba(255,255,255,0.03);color:var(--gold);
    border:2px solid var(--gold);backdrop-filter:blur(10px);
  }
  .btn-outline:hover{background:var(--gold);color:#000;transform:translateY(-4px) scale(1.03);box-shadow:0 15px 40px rgba(230,184,0,0.5);}

  /* FLOATING ICONS */
  .float-icon{
    position:absolute;color:var(--gold);opacity:0.15;font-size:2rem;
    animation:floatIcon 8s infinite ease-in-out;pointer-events:none;
  }
  @keyframes floatIcon{
    0%,100%{transform:translateY(0) rotate(0);}
    50%{transform:translateY(-30px) rotate(15deg);}
  }

  .scroll-down{
    position:absolute;bottom:30px;left:50%;transform:translateX(-50%);
    color:var(--gold);font-size:1.5rem;animation:bounce 2s infinite;
    text-decoration:none;
  }
  @keyframes bounce{
    0%,100%{transform:translate(-50%,0);}
    50%{transform:translate(-50%,15px);}
  }

  /* SECTIONS */
  section{padding:120px 5%;max-width:1500px;margin:auto;position:relative;}
  .section-title{text-align:center;margin-bottom:80px;}
  .section-title .num{
    display:block;font-family:'Cinzel',serif;font-size:5rem;font-weight:900;
    color:rgba(230,184,0,0.06);line-height:1;margin-bottom:-30px;
    letter-spacing:5px;
  }
  .section-title h2{
    font-size:clamp(2rem,4.5vw,3.2rem);font-weight:900;margin-bottom:18px;
    background:linear-gradient(135deg,var(--gold2),#fff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    position:relative;display:inline-block;
  }
  .section-title p{color:var(--muted);max-width:650px;margin:auto;font-size:1.05rem;}
  .divider{
    width:120px;height:4px;margin:25px auto;position:relative;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
    border-radius:4px;
  }
  .divider::after{
    content:"◆";position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%);color:var(--gold);font-size:1rem;
    background:var(--bg);padding:0 10px;
    animation:spin3d 3s infinite linear;
  }

  /* TIMELINE */
  .timeline{position:relative;padding:20px 0;}
  .timeline::before{
    content:"";position:absolute;top:0;bottom:0;right:50%;
    width:3px;background:linear-gradient(180deg,transparent,var(--gold),var(--red),var(--purple),transparent);
    transform:translateX(50%);border-radius:3px;
    box-shadow:0 0 20px rgba(230,184,0,0.3);
  }
  .tl-item{display:flex;justify-content:flex-start;align-items:center;margin-bottom:70px;position:relative;}
  .tl-item:nth-child(even){justify-content:flex-end;}
  .tl-content{
    width:44%;background:linear-gradient(135deg,rgba(255,255,255,0.04),rgba(230,184,0,0.02));
    backdrop-filter:blur(15px);
    border:1px solid rgba(230,184,0,0.15);border-radius:20px;
    padding:30px;transition:.5s cubic-bezier(0.4,0,0.2,1);
    position:relative;overflow:hidden;
  }
  .tl-content::before{
    content:"";position:absolute;top:0;right:0;width:4px;height:100%;
    background:linear-gradient(180deg,var(--gold),var(--red));
    transform:scaleY(0);transform-origin:top;transition:.5s;
  }
  .tl-content:hover::before{transform:scaleY(1);}
  .tl-content:hover{
    transform:translateY(-10px) scale(1.02);
    border-color:var(--gold);
    box-shadow:0 30px 60px rgba(230,184,0,0.2), 0 0 0 1px rgba(230,184,0,0.3);
    background:linear-gradient(135deg,rgba(230,184,0,0.08),rgba(230,57,70,0.05));
  }
  .tl-year{
    display:inline-block;padding:6px 18px;border-radius:50px;
    background:linear-gradient(135deg,var(--gold),var(--red));
    color:#000;font-weight:900;font-size:.85rem;margin-bottom:15px;
    font-family:'Cinzel',serif;letter-spacing:1px;
    box-shadow:0 5px 20px rgba(230,184,0,0.3);
  }
  .tl-content h3{color:var(--gold2);margin-bottom:12px;font-size:1.3rem;font-weight:800;}
  .tl-content p{color:var(--muted);font-size:.95rem;}
  .tl-dot{
    position:absolute;right:50%;transform:translateX(50%);
    width:22px;height:22px;border-radius:50%;
    background:var(--gold);border:4px solid var(--bg);
    box-shadow:0 0 0 4px rgba(230,184,0,0.2), 0 0 30px var(--gold);
    z-index:2;
  }
  .tl-dot::after{
    content:"";position:absolute;inset:-8px;border-radius:50%;
    border:2px solid var(--gold);opacity:0;
    animation:pulseRing 2s infinite;
  }
  @keyframes pulseRing{
    0%{opacity:1;transform:scale(1);}
    100%{opacity:0;transform:scale(1.8);}
  }

  /* CARDS */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:35px;}
  .card{
    background:linear-gradient(135deg,rgba(255,255,255,0.04),rgba(139,92,246,0.02));
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.06);border-radius:24px;
    padding:40px 32px;transition:.5s cubic-bezier(0.4,0,0.2,1);
    position:relative;overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;top:0;right:0;width:100%;height:4px;
    background:linear-gradient(90deg,var(--gold),var(--red),var(--purple));
    transform:scaleX(0);transform-origin:right;transition:.5s;
  }
  .card::after{
    content:"";position:absolute;top:-50%;left:-50%;width:200%;height:200%;
    background:radial-gradient(circle,rgba(230,184,0,0.15),transparent 70%);
    opacity:0;transition:.5s;pointer-events:none;
  }
  .card:hover::before{transform:scaleX(1);}
  .card:hover::after{opacity:1;}
  .card:hover{
    transform:translateY(-15px) rotateX(2deg);
    border-color:rgba(230,184,0,0.4);
    box-shadow:0 40px 80px rgba(0,0,0,0.6), 0 0 40px rgba(230,184,0,0.15);
  }
  .card-icon{
    width:80px;height:80px;border-radius:22px;
    display:flex;align-items:center;justify-content:center;
    font-size:2.2rem;margin-bottom:25px;
    background:linear-gradient(135deg,rgba(230,184,0,0.15),rgba(230,57,70,0.15));
    color:var(--gold);transition:.5s;position:relative;
    border:1px solid rgba(230,184,0,0.2);
  }
  .card-icon::before{
    content:"";position:absolute;inset:0;border-radius:22px;
    background:linear-gradient(135deg,var(--gold),var(--red));
    opacity:0;transition:.5s;
  }
  .card-icon i{position:relative;z-index:2;transition:.5s;}
  .card:hover .card-icon::before{opacity:1;}
  .card:hover .card-icon i{color:#000;transform:scale(1.15) rotate(-10deg);}
  .card:hover .card-icon{transform:rotate(-5deg) scale(1.05);box-shadow:0 15px 40px rgba(230,184,0,0.4);}
  .card h3{margin-bottom:15px;color:#fff;font-size:1.35rem;font-weight:800;}
  .card p{color:var(--muted);font-size:.95rem;}

  /* GENRES */
  .genre-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:22px;}
  .genre{
    padding:35px 20px;text-align:center;border-radius:20px;
    background:linear-gradient(135deg,rgba(255,255,255,0.03),rgba(230,184,0,0.03));
    border:1px solid rgba(255,255,255,0.06);
    transition:.5s cubic-bezier(0.4,0,0.2,1);cursor:pointer;
    position:relative;overflow:hidden;
  }
  .genre::before{
    content:"";position:absolute;inset:0;
    background:linear-gradient(135deg,var(--gold),var(--red),var(--purple));
    opacity:0;transition:.5s;z-index:1;
  }
  .genre:hover::before{opacity:1;}
  .genre:hover{
    transform:translateY(-12px) scale(1.05);
    border-color:var(--gold);
    box-shadow:0 25px 50px rgba(230,184,0,0.3);
  }
  .genre i,.genre span{position:relative;z-index:2;transition:.5s;}
  .genre i{font-size:2.8rem;color:var(--gold);margin-bottom:18px;display:block;}
  .genre span{font-weight:800;font-size:1.05rem;}
  .genre:hover i,.genre:hover span{color:#000;}

  /* QUOTE */
  .quote-section{
    text-align:center;padding:100px 5%;position:relative;
    background:linear-gradient(135deg,rgba(230,184,0,0.05),rgba(139,92,246,0.05));
    border-radius:32px;margin:80px auto;max-width:1100px;
    border:1px solid rgba(230,184,0,0.15);
    overflow:hidden;
  }
  .quote-section::before,.quote-section::after{
    content:"";position:absolute;width:200px;height:200px;border-radius:50%;
    background:radial-gradient(circle,rgba(230,184,0,0.2),transparent 70%);
    filter:blur(40px);
  }
  .quote-section::before{top:-100px;right:-100px;}
  .quote-section::after{bottom:-100px;left:-100px;background:radial-gradient(circle,rgba(139,92,246,0.2),transparent 70%);}
  .quote-section i.fa-quote-right{
    font-size:4rem;color:var(--gold);opacity:.3;margin-bottom:25px;
    display:block;
  }
  .quote-section blockquote{
    font-size:clamp(1.2rem,2.8vw,1.9rem);font-weight:600;
    font-style:italic;margin-bottom:30px;line-height:1.7;
    position:relative;z-index:2;
    background:linear-gradient(135deg,#fff,var(--gold2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .quote-section cite{
    color:var(--gold);font-style:normal;font-weight:800;
    font-family:'Cinzel',serif;letter-spacing:2px;position:relative;z-index:2;
  }

  /* STATS */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:35px;text-align:center;}
  .stat{
    padding:40px 20px;border-radius:24px;
    background:linear-gradient(135deg,rgba(255,255,255,0.03),rgba(230,184,0,0.03));
    border:1px solid rgba(255,255,255,0.06);
    transition:.5s;position:relative;overflow:hidden;
  }
  .stat::before{
    content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--gold),var(--red));
    transform:scaleX(0);transition:.5s;
  }
  .stat:hover::before{transform:scaleX(1);}
  .stat:hover{transform:translateY(-10px);border-color:var(--gold);box-shadow:0 25px 50px rgba(230,184,0,0.2);}
  .stat i{font-size:2.5rem;color:var(--gold);margin-bottom:15px;display:block;}
  .stat h3{
    font-size:clamp(2.2rem,5vw,3.8rem);font-weight:900;
    background:linear-gradient(135deg,var(--gold2),var(--red));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-family:'Cinzel',serif;
    line-height:1;
  }
  .stat p{color:var(--muted);font-weight:700;margin-top:10px;}

  /* MOVIE CARDS */
  .movie-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:25px;}
  .movie{
    border-radius:20px;overflow:hidden;position:relative;
    aspect-ratio:2/3;cursor:pointer;transition:.5s;
    background:linear-gradient(135deg,#1a1a2e,#16213e);
    border:1px solid rgba(255,255,255,0.08);
  }
  .movie-poster{
    position:absolute;inset:0;
    background-size:cover;background-position:center;
    transition:.6s;
    display:flex;align-items:center;justify-content:center;
  }
  .movie-poster i{font-size:4rem;color:rgba(230,184,0,0.3);}
  .movie::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(0deg,rgba(5,5,10,0.95) 0%,transparent 60%);
  }
  .movie-info{
    position:absolute;bottom:0;right:0;left:0;padding:20px;z-index:2;
    transform:translateY(20px);transition:.5s;
  }
  .movie-info h4{color:var(--gold2);font-weight:800;margin-bottom:5px;font-size:1.05rem;}
  .movie-info span{color:var(--muted);font-size:.85rem;}
  .movie:hover{transform:translateY(-10px) scale(1.02);box-shadow:0 30px 60px rgba(230,184,0,0.3);border-color:var(--gold);}
  .movie:hover .movie-poster{transform:scale(1.1);}
  .movie:hover .movie-info{transform:translateY(0);}

  /* FOOTER */
  footer{
    background:linear-gradient(180deg,transparent,rgba(230,184,0,0.05));
    border-top:1px solid rgba(230,184,0,0.15);
    padding:80px 5% 40px;text-align:center;margin-top:80px;
  }
  .footer-logo{
    font-size:2.5rem;font-weight:900;margin-bottom:15px;font-family:'Cinzel',serif;
    background:linear-gradient(135deg,var(--gold3),var(--gold),var(--red));
    background-size:200% auto;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shine 4s ease infinite;letter-spacing:4px;
  }
  .socials{display:flex;justify-content:center;gap:20px;margin:30px 0;}
  .socials a{

  }
